<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <!-- Main landmark: helps with accessibility and SEO (A11Y) -->
    <main>
      <!-- Article: this is our profile card-->
      <article class="social-card">
        <!-- A11Y: alt="" treats this as decorative because the H1 provides the name context -->
        <img
          class="social-card__avatar"
          src="assets/images/avatar-jessica.jpeg"
          alt=""
        />

        <header>
          <!-- Header: groups introductory content -->
          <h1 class="social-card__name">Jessica Randall</h1>
          <p class="social-card__location">London, United Kingdom</p>
        </header>

        <p class="social-card__bio">"Front-end developer and avid reader."</p>

        <nav class="social-card__links" aria-label="Social links">
          <!-- Nav: wraps a major block of navigation/social links -->
          <ul>
            <li>
              <a
                class="social-card__btn"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                >GitHub</a
              >
            </li>
            <li>
              <a
                class="social-card__btn"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                >Frontend Mentor</a
              >
            </li>
            <li>
              <a
                class="social-card__btn"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                >LinkedIn</a
              >
            </li>
            <li>
              <a
                class="social-card__btn"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                >Twitter</a
              >
            </li>
            <li>
              <a
                class="social-card__btn"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                >Instagram</a
              >
            </li>
          </ul>
        </nav>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a
        href="https://www.frontendmentor.io?ref=challenge"
        target="_blank"
        rel="noopener noreferrer"
        >Frontend Mentor</a
      >. Coded by
      <a
        href="https://github.com/ezra1492"
        target="_blank"
        rel="noopener noreferrer"
        >Israel (Ray) Guevara</a
      >.
    </footer>
  </body>
</html>
